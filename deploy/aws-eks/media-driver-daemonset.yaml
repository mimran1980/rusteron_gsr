# Media Driver DaemonSet (plan §10.1/§10.4). One driver per DPDK node, each
# pod requesting one rusteron.io/dpdk-ena-pair, four whole CPUs, memory, and
# 2 MiB hugepages under Guaranteed QoS (requests == limits on every resource,
# so the kubelet's CPU Manager static policy hands it a dedicated cpuset).
#
# The device plugin injects the pair's /dev/vfio nodes + RUSTERON_DPDK_* env at
# Allocate time, so no vfio hostPath is declared here. The entrypoint
# (entrypoint.sh) derives the conductor/sender/receiver CPU affinities from the
# pod's effective cpuset and fails fast if fewer than 3 CPUs are available.
#
# Nodes are picked by the rusteron-dpdk/ena=true label and taint; the VPC CNI
# keeps the primary ENA for pod networking, while the two secondary ENAs stay
# bound to vfio-pci on the host (never claimed by the CNI — tagged
# node.k8s.amazonaws.com/no_manage=true in the launch template).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rusteron-media-driver
spec:
  selector:
    matchLabels:
      app: rusteron-media-driver
  template:
    metadata:
      labels:
        app: rusteron-media-driver
    spec:
      nodeSelector:
        rusteron-dpdk/ena: "true"
      tolerations:
        - key: rusteron-dpdk
          operator: Exists
          effect: NoSchedule
      containers:
        - name: media-driver
          image: rusteron-media-driver:dpdk
          envFrom:
            - configMapRef:
                name: rusteron-media-driver
          resources:
            requests:
              rusteron.io/dpdk-ena-pair: "1"
              cpu: "4"
              memory: 2Gi
              hugepages-2Mi: 2Gi
            limits:
              rusteron.io/dpdk-ena-pair: "1"
              cpu: "4"
              memory: 2Gi
              hugepages-2Mi: 2Gi
          volumeMounts:
            - name: hugepages
              mountPath: /dev/hugepages
      volumes:
        - name: hugepages
          hostPath:
            path: /dev/hugepages
